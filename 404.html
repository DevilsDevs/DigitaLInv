<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada · Invitaciones Digitales</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.cdnfonts.com/css/miama" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #f5f5f0;
            background-image: radial-gradient(circle at 1px 1px, rgba(72,101,71,0.08) 1px, transparent 0);
            background-size: 28px 28px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #2d2d2d;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(72, 101, 71, 0.15);
            padding: 60px 50px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 1s ease forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .divider {
            color: #486547;
            letter-spacing: 12px;
            font-size: 0.9rem;
            margin: 20px 0;
            opacity: 0.7;
        }

        .error-number {
            font-family: 'Miama', cursive;
            font-size: clamp(5rem, 20vw, 9rem);
            color: #486547;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(72, 101, 71, 0.2);
        }

        .headline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: 500;
            color: #3a3a3a;
            margin: 10px 0 6px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: #777;
            font-weight: 300;
            line-height: 1.6;
            max-width: 360px;
            margin: 0 auto 30px;
        }

        .btn-home {
            display: inline-block;
            text-decoration: none;
            background-color: #486547;
            color: #ffffff;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 14px 38px;
            border-radius: 50px;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 20px rgba(72, 101, 71, 0.25);
        }

        .btn-home:hover {
            background-color: #354d34;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(72, 101, 71, 0.35);
        }

        .footer-note {
            margin-top: 40px;
            font-family: 'Miama', cursive;
            font-size: 1.6rem;
            color: #486547;
            opacity: 0.6;
        }

        @media (max-width: 480px) {
            .card {
                padding: 44px 28px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="divider">♦ &nbsp; ♦ &nbsp; ♦</div>

        <div class="error-number">404</div>

        <h1 class="headline">Página no encontrada</h1>

        <p class="subtitle">
            La página que buscas no existe o fue movida.<br>
            Vuelve al inicio para descubrir nuestros diseños.
        </p>

        <a class="btn-home" href="./index.html">Volver al inicio</a>

        <div class="footer-note">DigitalInv</div>

        <div class="divider">♦ &nbsp; ♦ &nbsp; ♦</div>
    </div>

</body>
</html>
